[project]
name = "glove-detection"
version = "0.1.0"
description = "Gloved vs bare hand detection (fine-tuned YOLOv8s) with a CLI and a FastAPI service, CPU-only"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The versions the model was trained and first run with (January 2026 requirements.txt),
# with the CPU build of torch; that is the only change (experiment V1 in the tracker).
dependencies = [
    "fastapi>=0.116",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "pillow==12.1.0",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
    "ultralytics==8.3.252",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]  # the training notebook is kept as run on Colab

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
